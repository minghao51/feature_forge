site_name: Feature Forge
site_url: https://minghao51.github.io/feature_forge/
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
  - mkdocs-jupyter:
      execute: false
      theme: light
      include: ["*.ipynb", "*.py"]
      allow_errors: false
      include_source: true
      ignore_h1_titles: true
      cache: true
      cache_dir: .cache/mkdocs-jupyter
markdown_extensions:
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
extra_css:
  - stylesheets/jupyter-fix.css
extra_javascript:
  - javascripts/jupyter-theme-bridge.js
extra:
  version:
    provider: mike
