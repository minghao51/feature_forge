name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-src:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # mypy needs the pipeline extra so `import duckdb` in storage/catalog.py
      # resolves, and the observability extra so wandb's attr-defined ignores
      # are exercised as needed (warn_unused_ignores is on). The test job
      # installs the same extras at runtime.
      - run: uv sync --extra pipeline --extra observability --group dev
      - run: uv run ruff check src tests
      - run: uv run mypy src

  quality-debt:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check notebooks docs/notebooks
      - run: uv run mypy tests

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pin BLAS/MKL/OpenMP thread pools to 1 so each spawn worker's RSS
      # stays small (default would be one thread per core, ~2x baseline RSS).
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The pipeline extra (duckdb, sf-hamilton) is required by the catalog and
      # dataflow tests that run as part of the default suite. Installing it here
      # keeps the matrix honest about what the library actually exercises.
      - run: uv sync --extra pipeline --group dev
      - run: uv run pytest -m "not slow and not llm" --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  pipeline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra pipeline --group dev
      # The documentation profile renders DAGs via the `graphviz` Python
      # package, which shells out to the `dot` binary. The ubuntu-24.04 image
      # does not ship `dot`, so install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run pytest tests/unit/test_silver_dataflow.py -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/run_pip_audit.py

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/check_docs_references.py

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra pipeline --group dev
      - run: uv run --extra pipeline python scripts/generate_medallion_docs.py --check
      - run: uv run --extra pipeline pytest tests/unit/test_documentation.py -q
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/check_docs_references.py
      - run: uv run python scripts/build_docs_offline.py
