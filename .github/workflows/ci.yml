name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-src:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run mypy src

  mypy-tests:
    # 2026-09-05: the tests/ suite is mypy-clean (1015 → 0 errors, see
    # REPORT_LOG); regressions now fail the build instead of being tolerated.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check notebooks docs/notebooks
      - run: uv run mypy tests

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Single-thread the BLAS/OpenMP pools. Sandbox spawn workers import
      # numpy/pandas per call; on a shared runner the default one-thread-per-core
      # pools oversubscribe the CPU and push spawn+import past the 5s sandbox
      # deadline (the SandboxTimeoutError family, main run 35596522314). This is
      # the measured runner policy from PR #1 commit 4f1610e, not a timeout bump.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest -m "not slow and not llm" --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  package-contract:
    # PR 6B: core install (no extras) must not provide OpenFE/XGBoost; the
    # default model must work core-only, and the optional factories must fail
    # with precise `feature-forge[...]` install hints.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv build --wheel
      - name: Verify a clean standard wheel install
        run: |
          uv venv /tmp/feature-forge-core
          uv pip install --python /tmp/feature-forge-core/bin/python dist/*.whl
          /tmp/feature-forge-core/bin/python - <<'PY'
          import importlib.util
          import pandas as pd
          from feature_forge.evaluation.model_factory import ModelFactory

          optional = ("caafe", "openfe", "xgboost", "lightgbm", "catboost")
          present = [p for p in optional if importlib.util.find_spec(p)]
          assert not present, f"core install must not provide optional packages: {present}"
          model = ModelFactory().get_model(None, "classification")
          model.fit(pd.DataFrame({"x": [0, 1, 0, 1]}), [0, 1, 0, 1])
          assert model.predict(pd.DataFrame({"x": [0]})).shape == (1,)
          PY
      - run: uv run pytest tests/unit/test_package_contract.py -q

  hamilton-compat:
    # Compatibility lane: must vary Hamilton ONLY. numpy/pandas (and every
    # other dependency) are pinned from uv.lock via a generated constraints
    # file, and only the package under test is allowed to move.
    runs-on: ubuntu-24.04
    strategy:
      # fail-fast is disabled so both Hamilton cells report independently
      # instead of cancelling one when the other fails (run 35596522314
      # cancelled the 1.90.0 cell when `<2` failed).
      fail-fast: false
      matrix:
        hamilton-spec: ["apache-hamilton==1.90.0", "apache-hamilton<2"]
    env:
      # Same single-thread BLAS/OpenMP caps as `test`. Sandbox spawn workers
      # import numpy/pandas per call; oversubscribed native thread pools surface
      # as `std::system_error: Resource temporarily unavailable` (main run
      # 35596522314), so this lane keeps the measured 4f1610e runner policy.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Export locked constraints (all deps except Hamilton)
        # Pin every dependency to the uv.lock resolution so the lane cannot
        # drift numpy/pandas majors. apache-hamilton is excluded from the
        # constraints so the matrix spec alone selects the version under test.
        # --no-emit-project drops the `-e .` line, which uv rejects as an
        # unnamed constraint (`uv export --help` flags verified locally).
        run: >-
          uv export --format requirements-txt --no-header --no-hashes
          --no-annotate --no-emit-project --no-emit-package apache-hamilton
          --all-groups --group dev
          -o /tmp/constraints.txt
      - name: Record numpy/pandas versions before Hamilton install
        run: |
          uv pip list | grep -E "^(numpy|pandas) " | sort > /tmp/before.txt
          cat /tmp/before.txt
      - name: Install Hamilton under test (narrow upgrade)
        # `--upgrade-package apache-hamilton` replaces the old blanket
        # `--upgrade`: only Hamilton may move, and the constraints file keeps
        # numpy/pandas and everything else at their locked versions.
        run: >-
          uv pip install
          --upgrade-package apache-hamilton
          --constraint /tmp/constraints.txt
          "${{ matrix.hamilton-spec }}"
      - name: Verify numpy/pandas unchanged
        # Fails loudly if the constraint approach silently failed to pin, i.e.
        # if the lane changed more than Hamilton.
        run: |
          uv pip list | grep -E "^(numpy|pandas) " | sort > /tmp/after.txt
          cat /tmp/after.txt
          if ! diff -u /tmp/before.txt /tmp/after.txt; then
            echo "::error::Hamilton install changed numpy/pandas; constraint pinning failed"
            exit 1
          fi
      - run: >-
          uv run pytest
          tests/unit/test_dataflow_inventory.py
          tests/unit/test_hamilton_cache.py
          tests/unit/test_silver_dataflow.py
          tests/unit/test_gold_dataflow.py
          tests/unit/test_platinum_dataflow.py
          -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/run_pip_audit.py

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  intel:
    # ADR 0010 follow-up: guard the OpenMP single-runtime invariants whenever
    # the `intel` extra is installed. No API key needed — synthetic data only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev --extra intel --extra xgboost --extra lightgbm
      - run: uv run python scripts/check_openmp_single_runtime.py
      - run: uv run python scripts/intel_smoke_test.py
        env:
          INTEL_SMOKE_TIMEOUT: "300"

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/check_docs_references.py
